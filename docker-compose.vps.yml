services:
  frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    restart: unless-stopped
    ports: ["127.0.0.1:3100:80"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
  api:
    build: { context: ., target: api }
    restart: unless-stopped
    env_file: .env
    # Segredos operacionais não são disponibilizados à aplicação.
    environment:
      SUPABASE_ACCESS_TOKEN: ""
      WWPANEL_PANEL_USER: ""
      WWPANEL_PANEL_PASS: ""
      MINIMAX_API_KEY: ""
    volumes:
      - /opt/certificados:/run/certificados:ro
    ports: ["127.0.0.1:8081:8080"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: { redis: { condition: service_healthy } }
    networks: [default, shared-net]
  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    env_file: .env
    # Segredos operacionais não são disponibilizados à aplicação.
    environment:
      SUPABASE_ACCESS_TOKEN: ""
      WWPANEL_PANEL_USER: ""
      WWPANEL_PANEL_PASS: ""
      MINIMAX_API_KEY: ""
    volumes:
      - /opt/certificados:/run/certificados:ro
    depends_on: { redis: { condition: service_healthy } }
    networks: [default, shared-net]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: ["horizons-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  horizons-redis:
networks:
  shared-net:
    external: true
