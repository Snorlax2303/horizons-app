server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Resolve the Docker service name at request time. Without this, nginx keeps
  # the old container IP after the API is recreated and returns 502s.
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $api_upstream api:8080;
  # Webhook credentials must never land in access logs during the migration
  # away from legacy query-string authentication.
  location = /api/webhooks/evolution {
    access_log off;
    client_max_body_size 1m;
    proxy_pass http://$api_upstream/webhooks/evolution;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /api/webhooks/efi {
    # The callback token is intentionally carried in the query string for the
    # Efí skip-mTLS mode; never persist it in the web-server access log.
    access_log off;
    client_max_body_size 1m;
    proxy_pass http://$api_upstream/webhooks/efi;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /panel-browser/ {
    access_log off;
    proxy_pass http://host.docker.internal:6080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
